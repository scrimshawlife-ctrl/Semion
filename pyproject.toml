[project]
name = "semion"
version = "0.1.0"
description = "SHADOW triad specialist. Signs, not minds."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daniel Meyer" }]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
semion = "semion.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
